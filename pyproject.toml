[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tony_algorithms_sorter"
version = "1.0.0"
description = "Performance comparison of Bubble Sort and Heap Sort"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sorting-benchmark = "tony_algorithms_sorter.cli:main"

[tool.setuptools.packages.find]
include = ["tony_algorithms_sorter*"]

